version: '3.8'

services:
  api:
    build: .
    container_name: cdid-api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./jobs:/app/jobs
      - ./logs:/app/logs
      - ./skills:/app/skills
    environment:
      - CDID_CONFIG_FILE=/app/config/config.yaml
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - cdid-network

  worker:
    build: .
    container_name: cdid-worker
    volumes:
      - ./config:/app/config
      - ./jobs:/app/jobs
      - ./logs:/app/logs
      - ./skills:/app/skills
      - ~/.gemini:/root/.gemini  # 挂载 Gemini CLI skills
    environment:
      - CDID_CONFIG_FILE=/app/config/config.yaml
    command: python -m src.worker.main
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - cdid-network

networks:
  cdid-network:
    driver: bridge
