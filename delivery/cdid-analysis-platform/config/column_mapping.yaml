# 字段映射配置（用于 raw_data.xlsx / CSV 的列名标准化）
#
# 说明：
# - 上游 Excel 表头经常是“字段名 + 括号中文说明”，例如：`did(设备主 ID（DID）)`
# - 系统会先“去掉括号说明”得到前缀，再按下方 variants 做别名匹配
# - 当你发现脚本里 required 的字段在新版本 Excel 中改了名字（或增加了新别名），
#   只需要在这里追加即可（无需修改分析脚本）。
#
# 生效方式：修改后重启 API/Worker。
#
# 可通过环境变量覆盖路径：
# - CDID_COLUMN_MAPPING_FILE=/abs/path/to/column_mapping.yaml

did:
  # 常用
  - did
  # 历史/别名
  - device_id
  - deviceid
  - deviceid_md5
  - device_fingerprint
  - 设备id
  - 设备指纹

oaid:
  - oaid
  - o_aid
  - oa_id
  - openid
  - open_aid
  - open_id
  - 设备标识

cdid:
  - cdid
  - c_did
  - client_did
  - clientid
  - client_id

android_id:
  - android_id
  - androidid
  - android_id_md5
  # 如果上游使用 ANDROID_ID(ANDROID_ID) 之类，可在这里追加前缀

sys__boot__id:
  - sys__boot__id
  - sys_boot_id
  - boot_id
  - boot__id

